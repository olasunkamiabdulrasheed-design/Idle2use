# Idle2Use — one-time Render blueprint (GitHub → Render).
#
# Architecture: this repo's Django API runs on Render next to a managed
# PostgreSQL database. The React frontend is deployed separately on Vercel
# and talks to the API via VITE_API_URL.
#
# Values marked `sync: false` must be filled in once in the Render dashboard:
#   - AI_API_KEY   (your OpenAI-compatible key — NEVER commit it)

services:
  - type: web
    name: idle2use-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # RENDER_EXTERNAL_HOSTNAME is appended automatically in settings.py;
      # this explicit value documents the expected API origin.
      - key: DJANGO_ALLOWED_HOSTS
        value: "idle2use-api.onrender.com"
      # Frontend origin — update to your real Vercel URL after the
      # Vercel deployment exists (e.g. https://idle2use.vercel.app).
      - key: CORS_ALLOWED_ORIGINS
        value: "https://idle2use.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://idle2use-api.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: idle2use-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: AI_MODEL
        value: "gpt-4o-mini"

databases:
  - name: idle2use-db
    databaseName: idle2use
    user: idle2use
    plan: free
